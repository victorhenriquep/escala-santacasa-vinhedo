<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escala Médica - Santa Casa de Vinhedo</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- Firebase Compat Libraries -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 antialiased font-sans pb-10">

  <!-- CABEÇALHO -->
  <header class="bg-indigo-700 text-white shadow-md mb-6">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-3">
      <div>
        <h1 class="text-xl md:text-2xl font-bold">Santa Casa de Vinhedo</h1>
        <p class="text-xs text-indigo-200">Gestão e Escala de Plantões Médicos</p>
      </div>
      <div id="info-usuario" class="flex items-center gap-3 text-right">
        <div>
          <p id="nome-usuario-logado" class="font-bold text-sm"></p>
          <p id="papel-usuario-logado" class="text-xs text-indigo-200"></p>
        </div>
        <button onclick="fazerLogout()" class="bg-indigo-800 hover:bg-indigo-900 text-white text-xs px-3 py-2 rounded-lg font-semibold transition">
          Sair
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-3 md:px-6">

    <!-- SEÇÃO DE AUTENTICAÇÃO (LOGIN / CADASTRO) -->
    <section id="secao-auth" class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-lg mt-8">
      <h2 id="titulo-auth" class="text-2xl font-bold text-center text-gray-800 mb-6">Acessar o Sistema</h2>
      
      <form onsubmit="manipularAuth(event)" class="flex flex-col gap-4">
        <div id="campo-nome" class="hidden flex flex-col gap-1">
          <label class="text-xs font-bold text-gray-700">Nome Completo</label>
          <input type="text" id="auth-nome" placeholder="Ex: Dr. Carlos Silva" class="border p-2.5 rounded-lg text-sm w-full border-gray-300 focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>

        <div id="campo-papel" class="hidden flex flex-col gap-1">
          <label class="text-xs font-bold text-gray-700">Função</label>
          <select id="auth-papel" class="border p-2.5 rounded-lg text-sm w-full border-gray-300 focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
            <option value="medico">Médico(a)</option>
            <option value="admin">Administrador(a)</option>
          </select>
        </div>

        <div class="flex flex-col gap-1">
          <label class="text-xs font-bold text-gray-700">E-mail</label>
          <input type="email" id="auth-email" required placeholder="seu@email.com" class="border p-2.5 rounded-lg text-sm w-full border-gray-300 focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>

        <div class="flex flex-col gap-1">
          <label class="text-xs font-bold text-gray-700">Senha</label>
          <input type="password" id="auth-senha" required placeholder="••••••••" class="border p-2.5 rounded-lg text-sm w-full border-gray-300 focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>

        <button type="submit" id="btn-submit-auth" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg transition mt-2">
          Entrar
        </button>
      </form>

      <div class="text-center mt-4 pt-4 border-t border-gray-100">
        <span id="texto-alternar" class="text-xs text-gray-600">Não tem uma conta?</span>
        <button onclick="alternarModoAuth()" id="btn-alternar" class="text-xs font-bold text-indigo-600 hover:underline ml-1">
          Cadastre-se
        </button>
      </div>
    </section>

    <!-- SEÇÃO PRINCIPAL DA APLICAÇÃO -->
    <section id="secao-app" class="hidden flex flex-col gap-6">

      <!-- PAINEL ADMINISTRATIVO (CADASTRAR PLANTÃO) -->
      <div id="painel-admin" class="bg-white p-4 md:p-6 rounded-xl shadow-md border-t-4 border-indigo-600 hidden">
        <h3 class="font-bold text-base md:text-lg text-gray-800 mb-4">Escalar Novo Plantão</h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3">
          <div>
            <label class="text-xs font-bold text-gray-600 block mb-1">Data</label>
            <input type="date" id="nova-data" class="w-full border border-gray-300 p-2 rounded-lg text-sm outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="text-xs font-bold text-gray-600 block mb-1">Hora Início</label>
            <input type="time" id="hora-inicio" class="w-full border border-gray-300 p-2 rounded-lg text-sm outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="text-xs font-bold text-gray-600 block mb-1">Hora Fim</label>
            <input type="time" id="hora-fim" class="w-full border border-gray-300 p-2 rounded-lg text-sm outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="text-xs font-bold text-gray-600 block mb-1">Médico(a)</label>
            <select id="novo-medico" class="w-full border border-gray-300 p-2 rounded-lg text-sm outline-none focus:border-indigo-500 bg-white">
              <option value="">Carregando médicos...</option>
            </select>
          </div>
          <div class="flex items-end">
            <button onclick="criarPlantao()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg text-sm transition">
              + Escalar
            </button>
          </div>
        </div>
      </div>

      <!-- CALENDÁRIO -->
      <div class="bg-white p-3 md:p-6 rounded-xl shadow-md w-full overflow-hidden">
        <div class="flex justify-between items-center mb-4 gap-2">
          <button onclick="mudarMesCalendario(-1)" class="px-2.5 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg text-xs md:text-sm font-bold transition">
            ◀ Anter.
          </button>
          <h3 id="titulo-mes-calendario" class="font-extrabold text-sm md:text-lg text-gray-800 text-center"></h3>
          <button onclick="mudarMesCalendario(1)" class="px-2.5 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg text-xs md:text-sm font-bold transition">
            Próx. ▶
          </button>
        </div>

        <div class="grid grid-cols-7 gap-1 text-center font-bold text-[10px] md:text-xs text-gray-500 mb-2">
          <div>Dom</div><div>Seg</div><div>Ter</div><div>Qua</div><div>Qui</div><div>Sex</div><div>Sáb</div>
        </div>

        <div id="grid-calendario" class="grid grid-cols-7 gap-1 w-full">
          <!-- Renderizado dinamicamente via JS -->
        </div>
      </div>

      <!-- LISTA DE PLANTÕES -->
      <div class="bg-white p-3 md:p-6 rounded-xl shadow-md w-full">
        <div class="flex justify-between items-center mb-4">
          <h3 class="font-bold text-base md:text-lg text-gray-800">Meus Plantões / Escala</h3>
          <span id="contador-plantoes" class="text-xs bg-indigo-100 text-indigo-800 font-bold px-2.5 py-1 rounded-full">0 plantões</span>
        </div>

        <div id="lista-plantoes" class="grid grid-cols-1 md:grid-cols-2 gap-3 md:gap-4">
          <!-- Renderizado dinamicamente via JS -->
        </div>

        <!-- Paginação -->
        <div id="paginacao-container" class="flex justify-between items-center mt-4 pt-3 border-t border-gray-100 hidden">
          <button id="btn-pag-anterior" onclick="mudarPagina(-1)" class="px-3 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-semibold rounded-lg disabled:opacity-50 transition">
            ◀ Anterior
          </button>
          <span id="info-paginacao" class="text-xs font-medium text-gray-600">Página 1</span>
          <button id="btn-pag-proxima" onclick="mudarPagina(1)" class="px-3 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-semibold rounded-lg disabled:opacity-50 transition">
            Próxima ▶
          </button>
        </div>
      </div>

    </section>
  </main>

  <!-- MODAL DE EDIÇÃO / REPASSE -->
  <div id="modal-editar" class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-6">
      <h3 class="text-lg font-bold text-gray-800 mb-4">Alterar / Repassar Plantão</h3>
      <form onsubmit="salvarEdicaoPlantao(event)" class="flex flex-col gap-3">
        <div>
          <label class="text-xs font-bold text-gray-600 block mb-1">Data</label>
          <input type="date" id="edit-data" required class="w-full border border-gray-300 p-2 rounded-lg text-sm outline-none focus:border-indigo-500">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs font-bold text-gray-600 block mb-1">Hora Início</label>
            <input type="time" id="edit-hora-inicio" required class="w-full border border-gray-300 p-2 rounded-lg text-sm outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="text-xs font-bold text-gray-600 block mb-1">Hora Fim</label>
            <input type="time" id="edit-hora-fim" required class="w-full border border-gray-300 p-2 rounded-lg text-sm outline-none focus:border-indigo-500">
          </div>
        </div>
        <div>
          <label class="text-xs font-bold text-gray-600 block mb-1">Médico(a) Responsável</label>
          <select id="edit-medico" required class="w-full border border-gray-300 p-2 rounded-lg text-sm outline-none focus:border-indigo-500 bg-white">
          </select>
        </div>
        <div class="flex gap-2 justify-end mt-4">
          <button type="button" onclick="fecharModalEditar()" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-lg text-xs font-bold transition">
            Cancelar
          </button>
          <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-bold transition">
            Salvar Alterações
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- SCRIPT JS PRINCIPAL COM PREVENÇÃO DE CACHE DE DISPOSITIVOS MÓVEIS -->
  <script src="js/app.js?v=2.0"></script>
</body>
</html>
